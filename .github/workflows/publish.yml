name: Coverage Pages
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: coverage-production
  cancel-in-progress: false
jobs:
  prepare:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
      actions: read
    outputs:
      publish: ${{ steps.source.outputs.publish }}
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
      - run: node --test tests/*.test.cjs
      - name: Select successful public core coverage
        id: source
        uses: actions/github-script@v8
        with:
          script: |
            const fs=require('node:fs');
            const {select,needsPublish,publicationDecision}=require('./scripts/source.cjs');
            const {presentationNeedsPublish}=require('./scripts/report.cjs');
            const [source,panack]=await Promise.all([select(github),select(github,'source')]);
            fs.writeFileSync('selection.json',JSON.stringify(source));
            fs.writeFileSync('source-selection.json',JSON.stringify(panack));
            core.setOutput('run',String(source.check_run));
            core.setOutput('name',`native-coverage-${source.check_run}`);
            core.setOutput('source-run',String(panack.check_run));
            core.setOutput('source-name',`source-coverage-${panack.check_run}`);
            const changes=await Promise.all([
              needsPublish(source,'https://coverage.panackelty.com/provenance.json'),
              needsPublish(panack,'https://coverage.panackelty.com/source/provenance.json'),
              presentationNeedsPublish('https://coverage.panackelty.com/presentation.json').then(publish=>({publish,reason:null}))]);
            const {publish:changed,newerLive}=publicationDecision(changes);
            for(const {decision,index} of newerLive) {
              const channel=index===0?'native':'source', selected=index===0?source:panack;
              core.warning(`Skipping publication to preserve the live ${channel} report: live run ${decision.live.run_number}/${decision.live.run_attempt} is newer than selected run ${selected.run_number}/${selected.run_attempt}.`);
            }
            core.setOutput('publish',String(changed));
            await core.summary.addHeading('Independent coverage sources').addCodeBlock(JSON.stringify({native:source,panack,publication:changes},null,2),'json').write();
      - name: Download exact trusted report
        if: steps.source.outputs.publish == 'true'
        uses: actions/download-artifact@v8
        with:
          github-token: ${{ github.token }}
          repository: sproates/panackelty
          run-id: ${{ steps.source.outputs.run }}
          name: ${{ steps.source.outputs.name }}
          path: report
      - name: Download exact trusted next source report
        if: steps.source.outputs.publish == 'true'
        uses: actions/download-artifact@v8
        with:
          github-token: ${{ github.token }}
          repository: sproates/panackelty
          run-id: ${{ steps.source.outputs.source-run }}
          name: ${{ steps.source.outputs.source-name }}
          path: source-report
      - name: Build independent report site
        if: steps.source.outputs.publish == 'true'
        run: node scripts/report.cjs build-dual report source-report public selection.json source-selection.json
      - name: Recheck source before publication
        if: steps.source.outputs.publish == 'true'
        uses: actions/github-script@v8
        with:
          script: |
            const {select,same}=require('./scripts/source.cjs');
            const pinned=require('./selection.json');
            const panack=require('./source-selection.json');
            const [nativeLatest,sourceLatest]=await Promise.all([select(github),select(github,'source')]);
            if(!same(pinned,nativeLatest) || !same(panack,sourceLatest)) throw new Error('Coverage advanced during preparation; retry');
      - uses: actions/upload-pages-artifact@v5
        if: steps.source.outputs.publish == 'true' && github.event_name != 'pull_request'
        with:
          path: public
  deploy:
    if: needs.prepare.outputs.publish == 'true'
    needs: prepare
    runs-on: ubuntu-24.04
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/deploy-pages@v5
        id: deployment
  verify:
    needs: deploy
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/download-artifact@v8
        with:
          name: github-pages
          path: artifact
      - name: Verify every live report file
        run: |
          mkdir expected
          tar -xf artifact/artifact.tar -C expected
          for attempt in 1 2 3 4 5; do
            if node scripts/report.cjs verify expected https://coverage.panackelty.com/; then exit 0; fi
            sleep 10
          done
          exit 1
